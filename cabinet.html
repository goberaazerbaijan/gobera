<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Gobera - Şəxsi Kabinet</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body { background:#f0f2f5; }
  .container { max-width:800px; margin:40px auto; padding:25px; background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { color:#007bff; margin-bottom:20px; }
  .order { background:#f9f9f9; padding:15px; border-radius:8px; margin-bottom:12px; }
  .order-header { display:flex; justify-content:space-between; flex-wrap:wrap; margin-bottom:8px; }
  .status { padding:4px 10px; border-radius:12px; font-size:12px; font-weight:bold; }
  .status-Gözləyir { background:#fff3cd; color:#856404; }
  .status-Təsdiqləndi { background:#d4edda; color:#155724; }
  .status-İmtina { background:#f8d7da; color:#721c24; }
  input, button { padding:10px; border-radius:6px; font-size:14px; }
  input { border:1px solid #ddd; width:100%; margin-bottom:10px; }
  button { background:#007bff; color:#fff; border:none; cursor:pointer; width:100%; font-weight:500; }
  button.danger { background:#dc3545; margin-top:10px; }
  .back { display:inline-block; margin-bottom:15px; color:#007bff; text-decoration:none; }
  .user-info { background:#e7f3ff; padding:12px; border-radius:8px; margin-bottom:20px; }
</style>
</head>
<body>
<div class="container" id="loginView">
  <h1>🔐 Giriş / Qeydiyyat</h1>
  <input type="email" id="email" placeholder="Email" onkeypress="if(event.key==='Enter') document.getElementById('password').focus()">
  <input type="password" id="password" placeholder="Parol" onkeypress="if(event.key==='Enter') doAuth()">
  <button onclick="doAuth()" id="authBtn">Daxil ol</button>
  <p style="text-align:center; margin-top:12px; color:#007bff; cursor:pointer;" onclick="toggleMode()" id="switchText">Hesabınız yoxdur? Qeydiyyatdan keçin</p>
  <a href="index.html" class="back" style="margin-top:15px; display:block;">← Mağazaya qayıt</a>
</div>

<div class="container" id="dashboardView" style="display:none;">
  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
    <h1>👤 Şəxsi Kabinet</h1>
    <a href="index.html" class="back">← Mağaza</a>
  </div>
  <div class="user-info">👋 Xoş gəldiniz, <strong id="userEmail"></strong></div>
  <h2 style="margin-bottom:15px;">Sifarişlərim</h2>
  <div id="ordersList"></div>
  <button class="danger" onclick="logout()">Çıxış Et</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAlAW0Wht8DIdi_cAwGvy8CL3afTetr89Q",
  authDomain: "gobera-azerbaijan.firebaseapp.com",
  projectId: "gobera-azerbaijan",
  storageBucket: "gobera-azerbaijan.firebasestorage.app",
  messagingSenderId: "198873257309",
  appId: "1:198873257309:web:af024dc77a57fcf94844b4",
  measurementId: "G-46YZDHVEFS"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let isRegister = false;
let currentUser = null;

window.toggleMode = function() {
  isRegister = !isRegister;
  document.getElementById('authBtn').innerText = isRegister ? 'Qeydiyyatdan Keç' : 'Daxil ol';
  document.getElementById('switchText').innerText = isRegister ? 'Hesabınız var? Giriş edin' : 'Hesabınız yoxdur? Qeydiyyatdan keçin';
};

window.doAuth = async function() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) { alert('Email və parol daxil edin!'); return; }
  try {
    if (isRegister) await createUserWithEmailAndPassword(auth, email, password);
    else await signInWithEmailAndPassword(auth, email, password);
  } catch (e) { alert('Xəta: ' + e.message); }
};

window.logout = function() { signOut(auth); };

onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('dashboardView').style.display = 'block';
    document.getElementById('userEmail').innerText = user.email;
    loadOrders(user.uid);
  } else {
    currentUser = null;
    document.getElementById('loginView').style.display = 'block';
    document.getElementById('dashboardView').style.display = 'none';
  }
});

function loadOrders(uid) {
  const q = query(collection(db, 'orders'), where('userId', '==', uid));
  onSnapshot(q, (snap) => {
    const orders = [];
    snap.forEach(d => orders.push({ id: d.id, ...d.data() }));
    orders.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    renderOrders(orders);
  });
}

function renderOrders(orders) {
  const list = document.getElementById('ordersList');
  if (orders.length === 0) { list.innerHTML = '<p style="text-align:center; color:#666;">Hələ heç bir sifarişiniz yoxdur.</p>'; return; }
  list.innerHTML = orders.map(o => `
    <div class="order">
      <div class="order-header">
        <strong>Sifariş #${o.id.slice(-6)}</strong>
        <span class="status status-${o.status}">${o.status}</span>
      </div>
      <div style="font-size:13px; color:#666; margin:5px 0;">💳 RRN: <strong>${o.rrn}</strong> | 💰 ${o.total.toFixed(2)} ₼</div>
      <div style="font-size:13px; margin-top:5px;">${o.items.map(i => `• ${i.name} (${i.qty}x ${i.price}₼)`).join('<br>')}</div>
      ${o.status === 'Gözləyir' ? '<p style="margin-top:8px; color:#856404; font-size:13px;">⏳ Admin təsdiqini gözləyir...</p>' : ''}
    </div>
  `).join('');
}
</script>
</body>
</html>
